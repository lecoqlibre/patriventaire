services:
  patriventaire:
    build: .
    image: patriventaire
    command: ["granian", "patriventaire.wsgi:application", "--interface", "wsgi", "--host", "0.0.0.0"]
    container_name: patriventaire
    env_file:
      - .env
    environment:
      - GRANIAN_STATIC_PATH_ROUTE=/static
      - GRANIAN_STATIC_PATH_MOUNT=./staticfiles
    volumes:
      - media:/usr/src/app/media
    depends_on:
      - patriventaire-database
    ports:
      - "8000:8000"
    restart: unless-stopped
  patriventaire-database:
    image: postgres:18-alpine
    container_name: patriventaire-database
    env_file:
      - .env
    volumes:
      - postgres-18:/var/lib/postgresql
    restart: unless-stopped
volumes:
  postgres-18: {}
  media: {}